name: PrintessFlow Staple Notarization

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Apple notarization submission ID (from the build log)'
        required: true
        type: string
      build_run_id:
        description: 'GitHub Actions run ID of the build that produced the .app'
        required: true
        type: string
      release_tag:
        description: 'GitHub release tag to publish to (e.g. v5.14.0)'
        required: true
        type: string

jobs:
  staple:
    name: Staple and publish .dmg
    runs-on: macos-14

    steps:
      - name: Check submission status
        id: check-status
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY_PATH"
          NOTARY_ARGS=(--key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --team-id "$APPLE_TEAM_ID")

          echo "Checking status of submission: ${{ inputs.submission_id }}"
          xcrun notarytool info "${{ inputs.submission_id }}" "${NOTARY_ARGS[@]}" 2>&1 | tee /tmp/notary_status.txt
          STATUS=$(grep "status:" /tmp/notary_status.txt | head -1 | awk '{print $2}')
          echo "Status: $STATUS"

          if [ "$STATUS" != "Accepted" ]; then
            echo "Submission is not Accepted (status: $STATUS) — cannot staple yet"
            if [ "$STATUS" = "Invalid" ]; then
              echo "=== Apple Rejection Log ==="
              xcrun notarytool log "${{ inputs.submission_id }}" "${NOTARY_ARGS[@]}" 2>&1 || true
            fi
            exit 1
          fi

      - name: Download .app from build artifact
        uses: actions/download-artifact@v4
        with:
          name: PrintessFlow-macOS-app
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          path: dist

      - name: Staple notarization ticket to .app
        run: |
          xcrun stapler staple "dist/PrintessFlow.app"
          xcrun stapler validate "dist/PrintessFlow.app"
          echo "Stapled successfully"

      - name: Build .dmg from stapled .app
        run: |
          mkdir -p dmg_stage
          cp -R "dist/PrintessFlow.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "PrintessFlow" -srcfolder dmg_stage -ov -format UDZO "PrintessFlow-macOS-arm64.dmg"
          hdiutil verify "PrintessFlow-macOS-arm64.dmg"

      - name: Publish .dmg to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "PrintessFlow-macOS-arm64.dmg" \
            --repo "${{ github.repository }}" \
            --clobber
          echo "Published to release ${{ inputs.release_tag }}"

      - name: Upload .dmg as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-macOS-arm64-stapled
          path: PrintessFlow-macOS-arm64.dmg
