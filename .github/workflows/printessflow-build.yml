name: PrintessFlow Build

# Overlay-based build pipeline for PrintessFlow 5.12.0.
#
# Instead of compiling Cura from source, this downloads the official UltiMaker
# Cura 5.12.0 release, applies the PrintessFlow customizations on top
# (packaging/overlay/apply_overlay.py), seeds the machine/profile config, and
# repackages. This reproduces exactly what CuraTestInstall.bat produces locally
# and what has been validated to slice correctly. No Conan build => fast.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which installers to build'
        type: choice
        options:
          - both
          - windows
          - macos
        default: both

jobs:
  build-windows:
    name: Windows installer (overlay on stock 5.12.0)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download stock UltiMaker Cura 5.12.0 (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/Ultimaker/Cura/releases/download/5.12.0/UltiMaker-Cura-5.12.0-win64-X64.exe"
          Invoke-WebRequest -Uri $url -OutFile cura_stock.exe
          "downloaded $((Get-Item cura_stock.exe).Length) bytes"

      - name: Silent-install stock Cura into C:\stock
        shell: pwsh
        # NSIS silent install (/S) into a clean dir (/D, must be last + unquoted),
        # giving a pristine Cura tree without installer scratch folders.
        run: |
          Start-Process -FilePath ".\cura_stock.exe" -ArgumentList '/S','/D=C:\stock' -Wait
          if (-not (Test-Path 'C:\stock\UltiMaker-Cura.exe')) {
            Write-Host "Install layout:"; Get-ChildItem C:\stock | Select-Object Name
            throw "stock Cura did not install as expected"
          }
          "stock install OK"

      - name: Apply PrintessFlow overlay
        run: python packaging/overlay/apply_overlay.py --app-root C:\stock --repo-root .

      - name: Stage app payload for NSIS
        shell: pwsh
        run: |
          $app = "packaging/printessflow/app"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item -Recurse -Force C:\stock\* "$app/"

      - name: Embed PrintessFlow icon into the app exe
        shell: pwsh
        # The app exe keeps UltiMaker's embedded icon after the stock install; the
        # NSIS rename to PrintessFlow.exe carries the icon along, so re-embed our
        # icon here (rcedit). Affects the Start menu / taskbar / Explorer icon.
        run: |
          choco install rcedit -y --no-progress | Out-Null
          $rcedit = (Get-Command rcedit -ErrorAction SilentlyContinue).Source
          if (-not $rcedit) { $rcedit = "C:\ProgramData\chocolatey\bin\rcedit.exe" }
          & $rcedit "packaging/printessflow/app/UltiMaker-Cura.exe" --set-icon "packaging/printessflow/PrintessFlow.ico"
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed: $LASTEXITCODE" }
          Write-Host "exe icon embedded"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build the PrintessFlow installer (NSIS)
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          Push-Location packaging/printessflow
          & $makensis /V3 PrintessFlow.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Verify installer contains customizations
        shell: pwsh
        # Crack open the finished installer and assert the customizations + seed
        # are actually bundled, so a silently-stock build can never be published.
        run: |
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { $7z = "7z" }
          $list = & $7z l "packaging/printessflow/PrintessFlow-Setup.exe"
          $markers = @("WellPlateArrangeTool","PrintessAllMaterials","custom.def.json","printess_v1.0.cfg","Printess+V1+Series.global.cfg")
          foreach ($m in $markers) {
            if ($list -notmatch [regex]::Escape($m)) { throw "installer is missing customization marker: $m" }
          }
          Write-Host "installer customization markers verified"

      - name: Upload the installer
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-Windows-Setup
          path: packaging/printessflow/PrintessFlow-Setup.exe
          retention-days: 7
          if-no-files-found: warn

  build-macos:
    name: macOS installer (overlay on stock 5.12.0)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'macos' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download stock Cura 5.12.0 (arm64), copy the app
        run: |
          url="https://github.com/Ultimaker/Cura/releases/download/5.12.0/UltiMaker-Cura-5.12.0-macos-ARM64.dmg"
          curl -fL -o cura_stock.dmg "$url"
          echo "downloaded $(stat -f%z cura_stock.dmg) bytes"
          # UltiMaker's dmg has a license agreement; pipe `yes` to auto-accept it,
          # and let it auto-mount (a fixed -mountpoint fails on this multi-partition
          # image, giving "attach canceled").
          yes | hdiutil attach cura_stock.dmg -nobrowse -noverify -noautoopen
          echo "Volumes:"; ls -1 /Volumes
          VOL=$(ls -d /Volumes/*[Cc]ura* 2>/dev/null | head -1)
          SRC=$(ls -d "$VOL"/*.app | head -1)
          echo "stock app: $SRC  (vol: $VOL)"
          cp -R "$SRC" "PrintessFlow.app"
          hdiutil detach "$VOL"

      - name: Apply PrintessFlow overlay
        run: python3 packaging/overlay/apply_overlay.py --app-root "PrintessFlow.app" --repo-root .

      - name: Bundle seed + install first-run launcher
        run: |
          APP="PrintessFlow.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RES_DIR="$APP/Contents/Resources"
          mkdir -p "$RES_DIR/seed"
          cp -R "packaging/printessflow/seed/." "$RES_DIR/seed/"
          echo "Seed files bundled: $(find "$RES_DIR/seed" -type f | wc -l)"
          EXEC_NAME=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleExecutable)
          echo "Wrapping executable: $EXEC_NAME"
          mv "$MACOS_DIR/$EXEC_NAME" "$MACOS_DIR/PrintessFlow-bin"
          cp "packaging/MacOS/printessflow-launcher.sh" "$MACOS_DIR/$EXEC_NAME"
          chmod +x "$MACOS_DIR/$EXEC_NAME"
          echo "Launcher installed"

      - name: Verify customizations landed
        # Assert seed, launcher, and custom plugins are present in the .app before
        # it is signed and packaged, so a silently-stock build can never ship.
        run: |
          APP="PrintessFlow.app"
          fail=0
          check() { if [ ! -e "$1" ]; then echo "MISSING: $1"; fail=1; fi; }
          check "$APP/Contents/Resources/seed/cura/5.12/machine_instances/Printess+V1+Series.global.cfg"
          check "$APP/Contents/MacOS/PrintessFlow-bin"
          check "$APP/Contents/Resources/share/cura/plugins/WellPlateArrangeTool/plugin.json"
          check "$APP/Contents/Resources/share/cura/plugins/PrintessAllMaterials/plugin.json"
          check "$APP/Contents/Resources/share/cura/resources/setting_visibility/printess_v1.0.cfg"
          EXEC_NAME=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleExecutable)
          head -1 "$APP/Contents/MacOS/$EXEC_NAME" | grep -q '^#!/bin/bash' || { echo "launcher not installed as CFBundleExecutable"; fail=1; }
          [ $fail -eq 0 ] || { echo "customization verification FAILED"; exit 1; }
          echo "customizations verified"

      - name: Brand the app (icon + name)
        # Replace the stock UltiMaker icns with a PrintessFlow icns generated from
        # the 2048px source, and set the bundle display name. Must run before signing.
        run: |
          APP="PrintessFlow.app"
          SRC="packaging/MacOS/PrintessFlow.png"
          mkdir -p PrintessFlow.iconset
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz       "$SRC" --out "PrintessFlow.iconset/icon_${sz}x${sz}.png"     >/dev/null
            sips -z $((sz*2)) $((sz*2)) "$SRC" --out "PrintessFlow.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns PrintessFlow.iconset -o PrintessFlow.icns
          ICON_FILE=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleIconFile 2>/dev/null || echo "")
          case "$ICON_FILE" in "") ICON_FILE="cura.icns";; *.icns) ;; *) ICON_FILE="${ICON_FILE}.icns";; esac
          echo "replacing bundle icon: $ICON_FILE"
          cp PrintessFlow.icns "$APP/Contents/Resources/$ICON_FILE"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleName PrintessFlow" "$APP/Contents/Info.plist" 2>/dev/null || $PB -c "Add :CFBundleName string PrintessFlow" "$APP/Contents/Info.plist"
          $PB -c "Set :CFBundleDisplayName PrintessFlow" "$APP/Contents/Info.plist" 2>/dev/null || $PB -c "Add :CFBundleDisplayName string PrintessFlow" "$APP/Contents/Info.plist"
          echo "branded"

      - name: Ad-hoc sign (test build)
        # Ad-hoc, NO hardened runtime, so CuraEngine runs unrestricted and we can
        # verify slicing in isolation. Developer ID signing + notarization + staple
        # are reintroduced in the hardening pass once the 5.12 product is confirmed.
        run: |
          APP="PrintessFlow.app"
          codesign --remove-signature "$APP" 2>/dev/null || true
          codesign --force --deep -s - "$APP"
          codesign --verify --deep "$APP" && echo "ad-hoc signed"

      - name: Build branded .dmg
        run: |
          brew install create-dmg >/dev/null
          mkdir -p dmg_stage
          cp -R "PrintessFlow.app" dmg_stage/
          create-dmg \
            --volname "PrintessFlow" \
            --volicon "PrintessFlow.icns" \
            --background "packaging/MacOS/printessflow_dmg_bg.png" \
            --window-size 660 400 \
            --icon-size 96 \
            --icon "PrintessFlow.app" 165 200 \
            --app-drop-link 495 200 \
            "PrintessFlow-macOS-arm64.dmg" \
            "dmg_stage/" || true
          if [ ! -f "PrintessFlow-macOS-arm64.dmg" ]; then
            echo "create-dmg failed; falling back to a plain dmg"
            ln -s /Applications dmg_stage/Applications
            hdiutil create -volname "PrintessFlow" -srcfolder dmg_stage -ov -format UDZO "PrintessFlow-macOS-arm64.dmg"
          fi
          hdiutil verify "PrintessFlow-macOS-arm64.dmg"

      - name: Upload the installer
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-macOS-arm64
          path: PrintessFlow-macOS-arm64.dmg
          retention-days: 7
          if-no-files-found: warn
