name: PrintessFlow Build

# Custom from-source build pipeline for the PrintessFlow fork. Self-contained:
# builds the LOCAL source via Conan on GitHub-hosted runners using UltiMaker's
# public Conan packages anonymously (no UltiMaker credentials, no self-hosted
# runners, no UltiMaker Sentry). Manual trigger only.
on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows installer (unsigned)
    runs-on: windows-2022
    steps:
      - name: Set up build environment (UltiMaker action, anonymous Conan)
        id: setup-environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          install_system_dependencies: true

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-windows-${{ hashFiles('conanfile.py', 'conandata.yml') }}
          restore-keys: conan-windows-

      - name: Set package overrides (installer profile)
        id: set-overrides
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ''
          profile: installer.jinja

      - name: Conan install (build PrintessFlow from local source)
        # Throwaway Sentry token: satisfies the curaengine/arcus/clipper validate()
        # so their package IDs match UltiMaker's PREBUILT binaries (downloaded, not
        # compiled from source). We configure no real telemetry. A clean Sentry-off
        # build (compiles from source, slow but cached) can be done later for release.
        run: conan install . --build=missing --update -of cura_inst --deployer-package="*" --profile ${{ steps.set-overrides.outputs.profile }} -c user.sentry:token=none

      - name: Create the distribution with PyInstaller
        id: prepare-distribution
        shell: cmd
        run: |
          call cura_inst\conanrun.bat
          python -m venv cura_installer_venv
          call cura_installer_venv\Scripts\Activate.bat
          python -m pip install -r cura_inst\packaging\pip_requirements_core_basic.txt --no-warn-script-location
          python -m pip install -r cura_inst\packaging\pip_requirements_core_hashes.txt --no-warn-script-location
          python -m pip install -r cura_inst\packaging\pip_requirements_installer_basic.txt --no-warn-script-location
          python Cura-workflows\runner_scripts\prepare_installer.py --os Windows --architecture X64 --summary-output %GITHUB_STEP_SUMMARY% --variables-output %GITHUB_OUTPUT%
          pyinstaller cura_inst\UltiMaker-Cura.spec

      - name: Workaround - copy exact MSVC redistributables
        run: |
          $PRE_MSDIR="C:/Program Files/Microsoft Visual Studio"
          $SELECT_MSDIR=(dir $PRE_MSDIR)[0].FullName
          $MSDIR=$SELECT_MSDIR+"/Community/VC/Redist/MSVC"
          $MSDIR_R=(dir -Exclude "v*" $MSDIR | Sort-Object Name -Descending)[0].FullName
          $MSDIR_DLLS=(dir $MSDIR_R/x64/Microsoft.VC*.CRT)[0].FullName
          copy $MSDIR_DLLS/concrt140.dll dist/UltiMaker-Cura/.
          copy $MSDIR_DLLS/msvcp140.dll dist/UltiMaker-Cura/.
          copy $MSDIR_DLLS/msvcp140_1.dll dist/UltiMaker-Cura/.
          copy $MSDIR_DLLS/msvcp140_2.dll dist/UltiMaker-Cura/.
          copy $MSDIR_DLLS/vcruntime140.dll dist/UltiMaker-Cura/.
          copy $MSDIR_DLLS/vcruntime140_1.dll dist/UltiMaker-Cura/.

      - name: Workaround - python3 dll
        run: copy Cura-workflows/python_dll_workaround/* dist/UltiMaker-Cura/.

      - name: Trim unused Qt files
        working-directory: dist/UltiMaker-Cura
        run: |
          $patterns = @("*assimp*","*qt6charts*","*qt6coap*","*qt6datavis*","*qt6labsani*","*qt6mqtt*","*qt6networkauth*","*quick3d*","*qt6timeline*","*qt6virtualkey*","*waylandcomp*","*qt5compat*")
          foreach ($p in $patterns) { Remove-Item .\* -Include $p -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Create the Windows exe installer (NSIS)
        working-directory: dist
        run: python ..\cura_inst\packaging\NSIS\create_windows_installer.py --source_path ../cura_inst --dist_path . --filename "${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.exe" --version "${{ steps.prepare-distribution.outputs.CURA_VERSION_FULL }}"

      - name: Upload the installer (unsigned)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-Windows-exe
          path: dist/${{ steps.prepare-distribution.outputs.INSTALLER_FILENAME }}.exe
          retention-days: 7
          if-no-files-found: warn
