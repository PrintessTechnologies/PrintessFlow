name: PrintessFlow Build

# Custom from-source build pipeline for the PrintessFlow fork. Self-contained:
# builds the LOCAL source via Conan on GitHub-hosted runners using UltiMaker's
# public Conan packages anonymously (no UltiMaker credentials, no self-hosted
# runners, no UltiMaker Sentry). Manual trigger only.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which installers to build'
        type: choice
        options:
          - both
          - windows
          - macos
        default: both

jobs:
  build-windows:
    name: Windows installer (unsigned)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-2022
    env:
      # Sentry: keep it "enabled" (throwaway token) so package IDs match UltiMaker's
      # prebuilt binaries where possible, but disable the symbol-upload sub-options so
      # from-source builds don't 401 pushing to UltiMaker's Sentry.
      CONAN_SENTRY_OPTS: >-
        -c user.sentry:token=none
        -o curaengine/*:sentry_send_binaries=False
        -o curaengine/*:sentry_create_release=False
        -o arcus/*:sentry_send_binaries=False
        -o cura/*:display_name=PrintessFlow
    steps:
      - name: Set up build environment (UltiMaker action, anonymous Conan)
        id: setup-environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          install_system_dependencies: true

      - name: Speed up Windows file I/O (exclude Conan cache from Defender)
        # OpenSSL/msys2 extract tens of thousands of tiny files; Windows Defender
        # real-time scanning makes that extraction crawl. Excluding the Conan cache
        # directory (and the conan process) cuts it from many minutes to seconds.
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.conan2"
          Add-MpPreference -ExclusionProcess "conan.exe"

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-windows-${{ hashFiles('conanfile.py', 'conandata.yml') }}
          restore-keys: conan-windows-

      - name: Set package overrides (installer profile)
        id: set-overrides
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ''
          profile: installer.jinja

      - name: Pin spdlog version (resolve upstream curaengine conflict)
        # curaengine upstream was updated to require spdlog/1.17.0 while other
        # packages still declare spdlog/1.15.1. Force the whole graph to 1.17.0
        # by appending to the [replace_requires] section the action already created
        # (adding the section header again causes a ConfigParser duplicate error).
        shell: pwsh
        run: |
          $profile = "$env:USERPROFILE\.conan2\profiles\${{ steps.set-overrides.outputs.profile }}"
          Add-Content $profile "spdlog/1.15.1: spdlog/1.17.0"

      - name: Generate source-tree files (CuraVersion.py)
        # PyInstaller bundles `cura` from the workspace checkout, where CuraVersion.py
        # is gitignored and absent (generate() during `conan create` only writes it
        # into Conan's package copy). `conan install .` runs the recipe's generate()
        # against the working tree, writing cura/CuraVersion.py here so the bundle
        # includes it. Deploy is not invoked (no --deployer-package), so it's safe.
        run: conan install . --build=missing --update --profile ${{ steps.set-overrides.outputs.profile }} ${{ env.CONAN_SENTRY_OPTS }}

      - name: Conan create (build + package PrintessFlow from local source)
        # Cura's deploy() needs a real package (package_folder + resdirs). `conan
        # install .` on the local recipe never packages cura, so package_folder is
        # None and deploy() crashes (TypeError at resdirs[2]). Mirror UltiMaker:
        # create the package locally first, then install --requires it (next step).
        run: conan create . --build=missing --update -tf="" --profile ${{ steps.set-overrides.outputs.profile }} ${{ env.CONAN_SENTRY_OPTS }}

      - name: Conan install (deploy the package, generate installer files)
        run: conan install --requires "cura/${{ steps.setup-environment.outputs.package_version }}" --build=missing --update -of cura_inst --deployer-package="*" --profile ${{ steps.set-overrides.outputs.profile }} ${{ env.CONAN_SENTRY_OPTS }}

      - name: Create the distribution with PyInstaller
        id: prepare-distribution
        shell: cmd
        run: |
          call cura_inst\conanrun.bat
          python -m venv cura_installer_venv
          call cura_installer_venv\Scripts\Activate.bat
          python -m pip install -r cura_inst\packaging\pip_requirements_core_basic.txt --no-warn-script-location
          python -m pip install -r cura_inst\packaging\pip_requirements_core_hashes.txt --no-warn-script-location
          python -m pip install -r cura_inst\packaging\pip_requirements_installer_basic.txt --no-warn-script-location
          python Cura-workflows\runner_scripts\prepare_installer.py --os Windows --architecture X64 --summary-output %GITHUB_STEP_SUMMARY% --variables-output %GITHUB_OUTPUT%
          pyinstaller cura_inst\UltiMaker-Cura.spec

      - name: Apply PrintessFlow resource overrides (splash + app icons)
        # UltiMaker's prebuilt cura_binary_data ships stock splash/icon PNGs into
        # share/cura/resources/images and, being later in the bundle order, wins
        # over our forked resources during PyInstaller bundling (last-one-wins).
        # The conandata.yml reorder makes ours win, but force-copy here too so the
        # branded splash + window/tray icon are guaranteed regardless of ordering.
        shell: pwsh
        run: |
          $dst = "dist/PrintessFlow/share/cura/resources/images"
          foreach ($img in @("cura.png","cura_wip.png","cura_enterprise.png","cura-icon.png","cura-icon-32.png")) {
            Copy-Item "resources/images/$img" "$dst/$img" -Force
            Write-Host "overrode $dst/$img"
          }

      - name: Workaround - copy MSVC redistributables
        # GitHub's hosted runner ships VS Enterprise (UltiMaker's runner has Community),
        # so the hardcoded \Community\ path doesn't exist. Locate the VC++ x64 CRT
        # redistributable folder regardless of edition/version and copy its DLLs.
        run: |
          $crt = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "Could not locate VC++ x64 CRT redistributable DLLs" }
          Write-Host "Copying CRT DLLs from: $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" "dist/PrintessFlow/"

      - name: Workaround - python3 dll
        run: copy Cura-workflows/python_dll_workaround/* dist/PrintessFlow/.

      - name: Trim unused Qt files
        working-directory: dist/PrintessFlow
        run: |
          $patterns = @("*assimp*","*qt6charts*","*qt6coap*","*qt6datavis*","*qt6labsani*","*qt6mqtt*","*qt6networkauth*","*quick3d*","*qt6timeline*","*qt6virtualkey*","*waylandcomp*","*qt5compat*")
          foreach ($p in $patterns) { Remove-Item .\* -Include $p -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Build the PrintessFlow installer (NSIS - branded, pre-seeded)
        shell: pwsh
        # Stage the built app payload into the packaging dir, then run our custom
        # NSIS installer which rebrands the exe, bundles the pre-seeded machine/
        # profiles + licenses, and launches with APPDATA redirected to the
        # install-local data folder (so it opens pre-configured, no add-printer).
        run: |
          $pkg = "packaging/printessflow"
          New-Item -ItemType Directory -Force -Path "$pkg/app" | Out-Null
          Copy-Item -Recurse -Force dist/PrintessFlow/* "$pkg/app/"
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          Push-Location $pkg
          & $makensis /V3 PrintessFlow.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Upload the installer (unsigned)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-Windows-Setup
          path: packaging/printessflow/PrintessFlow-Setup.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Prune Conan cache (drop build/source/temp folders)
        if: ${{ always() }}
        # Strip temporary build/source/download folders (msys2 extraction, OpenSSL
        # build trees, etc.), keeping only the final package binaries. Dramatically
        # shrinks the cache, speeding up both the save below and the restore next run.
        run: conan cache clean "*"

      - name: Save Conan cache
        # Runs even if an earlier step failed, so the expensive from-source dependency
        # build (OpenSSL/curaengine/etc.) is banked and future runs are fast.
        if: ${{ always() && steps.conan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-windows-${{ hashFiles('conanfile.py', 'conandata.yml') }}

  build-macos:
    name: macOS installer (arm64)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'macos' }}
    runs-on: macos-14
    env:
      # The macOS runner ships CMake 4.x, which removed compatibility with
      # cmake_minimum_required(VERSION < 3.5). Some from-source Conan deps
      # (e.g. nlopt 2.7.1) still declare an ancient minimum and fail to
      # configure. This env var tells CMake to treat those as 3.5 and proceed.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CONAN_SENTRY_OPTS: >-
        -c user.sentry:token=none
        -o curaengine/*:sentry_send_binaries=False
        -o curaengine/*:sentry_create_release=False
        -o arcus/*:sentry_send_binaries=False
        -o clipper/*:sentry_send_binaries=False
        -o cura/*:display_name=PrintessFlow
    steps:
      - name: Set up build environment (UltiMaker action, anonymous Conan)
        id: setup-environment
        uses: ultimaker/cura-workflows/.github/actions/setup-build-environment@main
        with:
          install_system_dependencies: true

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-macos-arm64-${{ hashFiles('conanfile.py', 'conandata.yml') }}
          restore-keys: conan-macos-arm64-

      - name: Set package overrides (installer profile)
        id: set-overrides
        uses: ultimaker/cura-workflows/.github/actions/set-package-overrides@main
        with:
          package_overrides: ''
          profile: installer.jinja

      - name: Pin spdlog version (resolve upstream curaengine conflict)
        run: |
          echo "spdlog/1.15.1: spdlog/1.17.0" >> ~/.conan2/profiles/${{ steps.set-overrides.outputs.profile }}

      - name: Generate source-tree files (CuraVersion.py)
        run: conan install . --build=missing --update --profile ${{ steps.set-overrides.outputs.profile }} ${{ env.CONAN_SENTRY_OPTS }}

      - name: Conan create (build + package PrintessFlow from local source)
        run: conan create . --build=missing --update -tf="" --profile ${{ steps.set-overrides.outputs.profile }} ${{ env.CONAN_SENTRY_OPTS }}

      - name: Conan install (deploy the package, generate installer files)
        run: conan install --requires "cura/${{ steps.setup-environment.outputs.package_version }}" --build=missing --update -of cura_inst --deployer-package="*" --profile ${{ steps.set-overrides.outputs.profile }} ${{ env.CONAN_SENTRY_OPTS }}

      - name: Create the distribution with PyInstaller
        id: prepare-distribution
        run: |
          source cura_inst/conanrun.sh
          python -m venv cura_installer_venv
          source cura_installer_venv/bin/activate
          python -m pip install -r cura_inst/packaging/pip_requirements_core_basic.txt --no-warn-script-location
          python -m pip install -r cura_inst/packaging/pip_requirements_core_hashes.txt --no-warn-script-location
          python -m pip install -r cura_inst/packaging/pip_requirements_installer_basic.txt --no-warn-script-location
          python Cura-workflows/runner_scripts/prepare_installer.py --os Macos --architecture ARM64 --summary-output $GITHUB_STEP_SUMMARY --variables-output $GITHUB_OUTPUT || true
          pyinstaller cura_inst/UltiMaker-Cura.spec

      - name: Apply PrintessFlow resource overrides (splash + app icons)
        # Same cura_binary_data override fix as Windows: force our branded splash
        # and icons over whatever got bundled, wherever PyInstaller placed the
        # resources tree inside the .app.
        run: |
          IMGDIR=$(find "dist/PrintessFlow.app" -type d -path "*share/cura/resources/images" | head -1)
          echo "images dir: $IMGDIR"
          for img in cura.png cura_wip.png cura_enterprise.png cura-icon.png cura-icon-32.png; do
            cp -f "resources/images/$img" "$IMGDIR/$img"
          done

      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Developer ID Application identity found in keychain"
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "Found identity: $IDENTITY"

      - name: Sign the .app bundle
        run: |
          APP="dist/PrintessFlow.app"
          ENTITLEMENTS="packaging/MacOS/cura.entitlements"
          # Sign every Mach-O binary from the inside out — no entitlements on inner files
          find "$APP" -type f | while read f; do
            if /usr/bin/file "$f" | grep -qE "Mach-O|bundle"; then
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
                "$f" 2>/dev/null || true
            fi
          done
          # Sign any embedded .framework bundles (directory-level, deepest first)
          find "$APP" -name "*.framework" -type d | sort -r | while read f; do
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
              "$f" 2>/dev/null || true
          done
          # Sign the app bundle itself with entitlements
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Signed successfully"

      - name: Build .dmg
        run: |
          mkdir -p dmg_stage
          cp -R "dist/PrintessFlow.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "PrintessFlow" -srcfolder dmg_stage -ov -format UDZO "PrintessFlow-macOS-arm64.dmg"
          hdiutil verify "PrintessFlow-macOS-arm64.dmg"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "PrintessFlow-macOS-arm64.dmg"

      - name: Notarize and staple .dmg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY_PATH"
          NOTARY_ARGS=(--key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --team-id "$APPLE_TEAM_ID")

          # Submit without --wait so CI is not blocked by Apple's processing time
          xcrun notarytool submit "PrintessFlow-macOS-arm64.dmg" \
            "${NOTARY_ARGS[@]}" 2>&1 | tee /tmp/notary_submit.txt
          SUBMISSION_ID=$(grep -E "^\s+id:" /tmp/notary_submit.txt | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          # Poll for up to 15 minutes (Apple usually responds in 2-5 min when healthy)
          STATUS="In Progress"
          for i in $(seq 1 9); do
            sleep 100
            echo "Checking status (attempt $i)..."
            xcrun notarytool info "$SUBMISSION_ID" "${NOTARY_ARGS[@]}" 2>&1 | tee /tmp/notary_status.txt || true
            STATUS=$(grep "status:" /tmp/notary_status.txt | head -1 | awk '{print $2}')
            echo "Status: $STATUS"
            if [ "$STATUS" = "Accepted" ] || [ "$STATUS" = "Invalid" ]; then
              break
            fi
          done

          if [ "$STATUS" = "Accepted" ]; then
            xcrun stapler staple "PrintessFlow-macOS-arm64.dmg"
            echo "Notarization and stapling complete"
          elif [ "$STATUS" = "Invalid" ]; then
            echo "=== Apple Notarization Log ==="
            xcrun notarytool log "$SUBMISSION_ID" "${NOTARY_ARGS[@]}" 2>&1 || true
            exit 1
          else
            echo "Apple still processing after 15 min (submission: $SUBMISSION_ID)"
            echo "DMG will be uploaded unstapled — macOS verifies notarization online"
          fi

      - name: Cleanup keychain
        if: ${{ always() }}
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Upload the installer
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-macOS-arm64
          path: PrintessFlow-macOS-arm64.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Prune Conan cache (drop build/source/temp folders)
        if: ${{ always() }}
        run: conan cache clean "*"

      - name: Save Conan cache
        if: ${{ always() && steps.conan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-macos-arm64-${{ hashFiles('conanfile.py', 'conandata.yml') }}
