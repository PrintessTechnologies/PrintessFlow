name: PrintessFlow Notarize macOS

# Standalone, async notarization path for the macOS build. Decoupled from
# PrintessFlow Build (which ships the ad-hoc-signed dmg immediately) so Apple
# notarization can never hold up an installer update.
#
# It rebuilds the same overlay app as the build workflow, but signs it with the
# Developer ID Application certificate + hardened runtime, submits the dmg to
# Apple's notary service, waits for the result, staples the ticket, and leaves
# the notarized dmg as a build artifact for a human to attach to the release.
on:
  workflow_dispatch:

jobs:
  notarize:
    name: Build, sign, notarize, staple (arm64)
    runs-on: macos-14
    permissions:
      contents: read    # no longer publishes to the release; see the note below
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download stock Cura 5.12.0 (arm64), copy the app
        run: |
          url="https://github.com/Ultimaker/Cura/releases/download/5.12.0/UltiMaker-Cura-5.12.0-macos-ARM64.dmg"
          curl -fL -o cura_stock.dmg "$url"
          echo "downloaded $(stat -f%z cura_stock.dmg) bytes"
          yes | hdiutil attach cura_stock.dmg -nobrowse -noverify -noautoopen
          VOL=$(ls -d /Volumes/*[Cc]ura* 2>/dev/null | head -1)
          SRC=$(ls -d "$VOL"/*.app | head -1)
          echo "stock app: $SRC  (vol: $VOL)"
          cp -R "$SRC" "PrintessFlow.app"
          hdiutil detach "$VOL"

      - name: Apply PrintessFlow overlay
        run: python3 packaging/overlay/apply_overlay.py --app-root "PrintessFlow.app" --repo-root .

      - name: Verify customizations landed
        # This job produces the only shippable .dmg, and it used to notarize
        # whatever the overlay happened to produce. A stock file surviving the
        # overlay would have been signed, notarized and released unnoticed,
        # which is exactly how the stock CameraTool shipped through 1.0.4.
        # Same assertions as the build workflow's macOS job.
        run: |
          APP="PrintessFlow.app"
          fail=0
          check() { if [ ! -e "$1" ]; then echo "MISSING: $1"; fail=1; fi; }
          check "$APP/Contents/Resources/share/cura/plugins/WellPlateArrangeTool/plugin.json"
          check "$APP/Contents/Resources/share/cura/plugins/PrintessAllMaterials/plugin.json"
          check "$APP/Contents/Resources/share/cura/plugins/PrintessPrintOrder/PrintessPrintOrder.py"
          check "$APP/Contents/Resources/share/cura/resources/setting_visibility/printess_v1.0.cfg"
          grep -q "_plateHalfSize" "$APP/Contents/Resources/share/uranium/plugins/Tools/TranslateTool/TranslateTool.py"             || { echo "MISSING: the Move tool's printer-frame coordinates"; fail=1; }
          grep -q "PRINTESS CHANGE" "$APP/Contents/Resources/share/uranium/plugins/Tools/CameraTool/CameraTool.py"             || { echo "MISSING: the smooth camera rotation fix"; fail=1; }
          grep -q "Object/Print Order list" "$APP/Contents/Resources/share/cura/resources/qml/ObjectSelector.qml"             || { echo "MISSING: the print order object list"; fail=1; }
          [ $fail -eq 0 ] || { echo "customization verification FAILED"; exit 1; }
          echo "customizations verified"

      - name: Bundle seed + install first-run launcher
        run: |
          APP="PrintessFlow.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RES_DIR="$APP/Contents/Resources"
          mkdir -p "$RES_DIR/seed"
          cp -R "packaging/printessflow/seed/." "$RES_DIR/seed/"
          EXEC_NAME=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleExecutable)
          echo "Wrapping executable: $EXEC_NAME"
          mv "$MACOS_DIR/$EXEC_NAME" "$MACOS_DIR/PrintessFlow-bin"
          cp "packaging/MacOS/printessflow-launcher.sh" "$MACOS_DIR/$EXEC_NAME"
          chmod +x "$MACOS_DIR/$EXEC_NAME"

      - name: Brand the app (icon + name)
        run: |
          APP="PrintessFlow.app"
          SRC="packaging/MacOS/PrintessFlow.png"
          mkdir -p PrintessFlow.iconset
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz       "$SRC" --out "PrintessFlow.iconset/icon_${sz}x${sz}.png"     >/dev/null
            sips -z $((sz*2)) $((sz*2)) "$SRC" --out "PrintessFlow.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns PrintessFlow.iconset -o PrintessFlow.icns
          ICON_FILE=$(defaults read "$(pwd)/$APP/Contents/Info" CFBundleIconFile 2>/dev/null || echo "")
          case "$ICON_FILE" in "") ICON_FILE="cura.icns";; *.icns) ;; *) ICON_FILE="${ICON_FILE}.icns";; esac
          cp PrintessFlow.icns "$APP/Contents/Resources/$ICON_FILE"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleName PrintessFlow" "$APP/Contents/Info.plist" 2>/dev/null || $PB -c "Add :CFBundleName string PrintessFlow" "$APP/Contents/Info.plist"
          $PB -c "Set :CFBundleDisplayName PrintessFlow" "$APP/Contents/Info.plist" 2>/dev/null || $PB -c "Add :CFBundleDisplayName string PrintessFlow" "$APP/Contents/Info.plist"

      - name: Import Developer ID certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/pf-signing.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Keep the login keychain searchable too, then prepend our signing keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in MAC_CERT_P12"
            security find-identity -v "$KEYCHAIN"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Sign app (Developer ID + hardened runtime)
        run: |
          APP="PrintessFlow.app"
          ENT="packaging/MacOS/cura.entitlements"
          # Collect every Mach-O and sign deepest-first (inside-out), then the bundle.
          MACHOS="$RUNNER_TEMP/machos.txt"
          find "$APP" -type f | while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then echo "$f"; fi
          done | awk '{ print gsub(/\//,"/"), $0 }' | sort -rn | cut -d' ' -f2- > "$MACHOS"
          echo "Signing $(wc -l < "$MACHOS") nested Mach-O binaries..."
          while IFS= read -r f; do
            codesign --force --timestamp --options runtime \
              --entitlements "$ENT" -s "$SIGN_IDENTITY" "$f"
          done < "$MACHOS"
          codesign --force --timestamp --options runtime \
            --entitlements "$ENT" -s "$SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          echo "Developer ID signed with hardened runtime"

      - name: Notarize the app + staple it
        # Submit the .app itself (zipped) and staple the ticket INTO the bundle.
        # This is what makes the app verify OFFLINE once a user drags it out of
        # the dmg — stapling only the dmg leaves the extracted app reliant on an
        # online notarization check, which fails offline/behind a firewall and
        # shows "Apple could not verify ... is free of malware".
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY_PATH"
          APP="PrintessFlow.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          bash packaging/MacOS/notarize.sh "$RUNNER_TEMP/app.zip" \
            "$KEY_PATH" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID" "$APPLE_TEAM_ID"
          # Staple (also network-bound) with a few retries.
          for i in 1 2 3 4 5; do
            xcrun stapler staple "$APP" && break || { echo "staple retry $i"; sleep 15; }
          done
          xcrun stapler validate "$APP"
          echo "App notarized + stapled"

      - name: Build branded .dmg (from the stapled app)
        run: |
          brew install create-dmg >/dev/null
          mkdir -p dmg_stage
          cp -R "PrintessFlow.app" dmg_stage/
          create-dmg \
            --volname "PrintessFlow" \
            --volicon "PrintessFlow.icns" \
            --background "packaging/MacOS/printessflow_dmg_bg.png" \
            --window-size 660 400 \
            --icon-size 96 \
            --icon "PrintessFlow.app" 165 200 \
            --app-drop-link 495 200 \
            "PrintessFlow-macOS-arm64.dmg" \
            "dmg_stage/" || true
          if [ ! -f "PrintessFlow-macOS-arm64.dmg" ]; then
            ln -s /Applications dmg_stage/Applications
            hdiutil create -volname "PrintessFlow" -srcfolder dmg_stage -ov -format UDZO "PrintessFlow-macOS-arm64.dmg"
          fi
          hdiutil verify "PrintessFlow-macOS-arm64.dmg"

      - name: Notarize + staple the dmg
        # The dmg contains an already-stapled app; also notarize + staple the dmg
        # itself so the download is trusted even before it is mounted.
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY_PATH"
          DMG="PrintessFlow-macOS-arm64.dmg"
          bash packaging/MacOS/notarize.sh "$DMG" \
            "$KEY_PATH" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID" "$APPLE_TEAM_ID"
          for i in 1 2 3 4 5; do
            xcrun stapler staple "$DMG" && break || { echo "staple retry $i"; sleep 15; }
          done
          xcrun stapler validate "$DMG"
          echo "DMG notarized + stapled (and contains a stapled app)"

      # The dmg is NOT uploaded to the release from here any more. That used
      # ${{ github.token }}, so the asset landed as github-actions[bot] rather
      # than as the account that owns the product. The notarized dmg leaves
      # this workflow as a build ARTIFACT and is attached to the release by
      # hand:
      #
      #   gh run download <this-run-id> --name PrintessFlow-macOS-arm64-notarized
      #   gh release upload vX.Y.Z PrintessFlow-macOS-arm64.dmg --clobber
      #
      # Signing, notarizing and stapling still happen HERE: they need macOS,
      # the Developer ID certificate and the notary key. Only the publishing
      # step moved out.

      - name: Upload notarized dmg as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PrintessFlow-macOS-arm64-notarized
          path: PrintessFlow-macOS-arm64.dmg
          retention-days: 7
          if-no-files-found: warn
